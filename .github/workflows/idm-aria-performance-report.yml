name: IDM · recover performance report from completed observations
on:
  push:
    branches: [audit/idm-aria-namespace-integration-20261126]
    paths: [.github/workflows/idm-aria-performance-report.yml]
permissions:
  actions: read
  contents: read
jobs:
  summarize:
    name: Aggregate archived evidence without live requests or Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IDM_CATALOG_METRICS_DIR: ${{ runner.temp }}/sealed-performance
    steps:
      - name: Download exact three completed observations
        uses: actions/download-artifact@v4
        with:
          name: idm-sealed-feeding-performance-e16bf676
          run-id: 45896487733
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sealed-performance
      - name: Report medians, maxima and request budgets without hiding failures
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, statistics
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          expected = {
              "musicbrainz", "musicbrainz_app_flow", "musicbrainz_home_granular",
              "musicbrainz_home_capacity_30", "itunes", "itunes_home_granular",
              "itunes_home_capacity_30", "discogs", "discogs_granular",
              "discogs_home_granular", "discogs_genre_12_positions",
              "discogs_overlapping_landing", "discogs_home_landing",
              "discogs_artist_30_target", "discogs_home_capacity_30", "discogs_home_capacity_100", "collective",
          }
          data = []
          for i in (1, 2, 3):
              path = root / f"round-{i}"
              cases = [c for f in (path/"junit").glob("TEST-*.xml")
                       for c in ET.parse(f).getroot().iter("testcase")]
              assert len(cases) == 1 and all(c.find(k) is None for c in cases for k in ("failure","error","skipped")), i
              sample = {p.stem.removeprefix("live_"): json.loads(p.read_text())
                        for p in path.glob("live_*.json")}
              assert sample.keys() == expected, (i, sorted(expected-sample.keys()), sorted(sample.keys()-expected))
              assert all(r["mode"] == "live-network-observation" for r in sample.values()), i
              data.append(sample)
          names = sorted(expected)
          keys = ("status", "displayed_unique", "editorial_eligible", "http_or_transport_reads",
                  "elapsed_ms", "first_verified_ms", "initial_elapsed_ms", "initial_first_verified_ms",
                  "source_candidates_consumed", "source_index_reads", "source_master_reads",
                  "source_release_reads", "verified_target", "verified_landing_genres",
                  "source_gestures", "source_candidate_budget", "incomplete_coverage")
          results = {}
          for name in names:
              rows = [{k: s[name][k] for k in keys if k in s[name]} for s in data]
              summary = {"rounds": rows}
              for key in ("elapsed_ms", "first_verified_ms", "initial_elapsed_ms", "initial_first_verified_ms",
                          "http_or_transport_reads", "displayed_unique"):
                  values = [r.get(key) for r in rows]
                  if all(isinstance(v, (int,float)) for v in values):
                      summary[key] = {"median": statistics.median(values), "max": max(values), "min": min(values)}
              results[name] = summary
              print("IDM_PERFORMANCE", name, json.dumps(summary, sort_keys=True))
          (root/"performance-summary.json").write_text(json.dumps(results, indent=2))
          # Report each explicit Discogs bound for the measured productive windows.
          # A failure/incomplete source response is not a healthy sample.
          for name in ("discogs_home_granular", "discogs_genre_12_positions"):
              rows = results[name]["rounds"]
              healthy = all(r["status"] == "verified" and 6 <= r["displayed_unique"] <= 8 for r in rows)
              elapsed = results[name].get("elapsed_ms", {})
              first = results[name].get("first_verified_ms", {})
              checks = {"three_healthy_windows": healthy,
                        "first_median_le_5000": first.get("median",float("inf")) <= 5000,
                        "first_max_le_10000": first.get("max",float("inf")) <= 10000,
                        "window_median_le_25000": elapsed.get("median",float("inf")) <= 25000,
                        "window_max_le_40000": elapsed.get("max",float("inf")) <= 40000,
                        "index_budget": all(r.get("source_index_reads",99)<=3 for r in rows),
                        "master_budget": all(r.get("source_master_reads",99)<=r["displayed_unique"] for r in rows),
                        "release_budget": all(r.get("source_release_reads",99)<=r["displayed_unique"] for r in rows),
                        "total_budget": all(r.get("http_or_transport_reads",99)<=27 for r in rows),
                        "dense_ratio": all(r.get("http_or_transport_reads",99)<=3*r["displayed_unique"] for r in rows)}
              print("IDM_PERFORMANCE_BOUNDS", name, json.dumps(checks, sort_keys=True))
          for name, first_key, elapsed_key in (
              ("discogs_home_landing", "first_verified_ms", "elapsed_ms"),
              ("discogs_artist_30_target", "first_verified_ms", "elapsed_ms"),
          ):
              summary = results[name]
              first = summary.get(first_key, {})
              checks = {"first_median_le_5000": first.get("median",float("inf")) <= 5000,
                        "first_max_le_10000": first.get("max",float("inf")) <= 10000}
              if name == "discogs_home_landing":
                  checks["landing_median_le_60000"] = summary.get(elapsed_key,{}).get("median",float("inf")) <= 60000
              print("IDM_PERFORMANCE_BOUNDS", name, json.dumps(checks, sort_keys=True))
          print("Capacity target 30 was not supported by the sealed harness: it defaulted to 100. Both measured milestones are retained.")
          print("No baseline comparison or independent warm-cache observation is inferred from absent telemetry.")
          PY
      - name: Preserve recovered summary
        uses: actions/upload-artifact@v4
        with:
          name: idm-sealed-performance-summary-e16bf676
          path: ${{ runner.temp }}/sealed-performance/performance-summary.json
          if-no-files-found: error
          retention-days: 7
