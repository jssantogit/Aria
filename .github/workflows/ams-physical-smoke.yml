name: AMS · isolated Android physical smoke APK
on:
  push:
    branches: [audit/ams-native-visual-parity-20261126]
    paths:
      - '.github/workflows/ams-physical-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ams-physical-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-smoke:
    if: github.ref == 'refs/heads/audit/ams-native-visual-parity-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify normal build keeps AMS blocked
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AmsPhysicalSmokePolicyTest' --tests 'com.music.bitchord.AppleMusicWebNativeProviderTest'
      - name: Verify isolated smoke admission and assemble
        run: |
          ./gradlew -Pbitchord.bundleWear=false -Paria.amsPhysicalSmoke=true :app:testDevDebugUnitTest --tests 'com.music.bitchord.AmsPhysicalSmokePolicyTest' :app:assembleDevDebug
      - name: Verify isolated package and debug status
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/dev/debug -maxdepth 1 -name '*arm64-v8a*.apk' | head -n 1)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > /tmp/ams-badging.txt
          grep -Fq "package: name='com.dev.bitchord.ams.smoke'" /tmp/ams-badging.txt
          grep -Fq "application-debuggable" /tmp/ams-badging.txt
          mkdir -p ams-smoke
          cp "$APK" ams-smoke/Aria-AMS-Smoke-arm64-v8a.apk
          {
            printf 'source_sha=%s\n' "$GITHUB_SHA"
            printf 'package=com.dev.bitchord.ams.smoke\n'
            printf 'build=devDebug; AMS readiness opt-in only; user choices required\n'
            sha256sum ams-smoke/*.apk
          } > ams-smoke/manifest.txt
          cat ams-smoke/manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aria-ams-smoke-arm64-${{ github.sha }}
          path: ams-smoke/
          if-no-files-found: error
          retention-days: 14
