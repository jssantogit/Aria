name: AMS · isolated cache contracts
on:
  push:
    branches:
      - audit/ams-cache-isolation-20261126
permissions:
  contents: read
concurrency:
  group: ams-cache-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AppleMusicWebFoundationTest' --tests 'com.music.bitchord.AppleMusicWebCacheBridgeTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-cache-contract-results
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
