name: IDM · Aria namespace integration audit
on:
  push:
    branches: [audit/idm-aria-namespace-integration-20261126]
    paths: [.github/workflows/idm-aria-integration-audit.yml]
permissions:
  contents: read
  actions: read
jobs:
  merge-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare pinned IDM and Aria trees without writing remote refs
        shell: bash
        env:
          IDM_SHA: 6efa91fb6dd2c2ad2a35897946aaf01e8812851a
          ARIA_SHA: 58d8d9143fa04302cb3356df510e77c76a2eae57
          MIGRATION_SOURCE: e74400a7e58cba41a64f535a90af1399e5c718da
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          git cat-file -e "$IDM_SHA^{commit}"
          git cat-file -e "$ARIA_SHA^{commit}"
          git cat-file -e "$MIGRATION_SOURCE^{commit}"
          git config user.name "IDM integration audit"
          git config user.email "idm-audit@users.noreply.github.com"
          git config merge.renameLimit 8000
          git config diff.renameLimit 8000
          report="$RUNNER_TEMP/idm-aria-audit"
          mkdir -p "$report"
          ancestor="$(git merge-base "$IDM_SHA" "$ARIA_SHA")"
          printf 'IDM %s\nAria %s\nAncestor %s\n' "$IDM_SHA" "$ARIA_SHA" "$ancestor" | tee "$report/pinned.txt"
          git diff --name-status --find-renames=50% "$ancestor" "$IDM_SHA" > "$report/idm-paths.txt"
          git diff --name-status --find-renames=50% "$ancestor" "$ARIA_SHA" > "$report/aria-paths.txt"
          # First capture an ordinary merge on the pinned trees.
          set +e
          git merge-tree --write-tree --name-only "$ARIA_SHA" "$IDM_SHA" > "$report/raw-merge.txt"
          raw_status=$?
          set -e
          test "$raw_status" -le 1
          printf 'Raw merge status: %s\n' "$raw_status" | tee "$report/status.txt"
          # Reuse the exact historical namespace preparation script from the
          # identity migration, for both sides of the IDM delta. These are
          # synthetic local trees, not commits to any remote branch.
          normalize() {
            local source="$1" label="$2" checkout="$RUNNER_TEMP/idm-$2"
            git worktree add --detach "$checkout" "$source" >&2
            mkdir -p "$checkout/.git-audit"
            git show "$MIGRATION_SOURCE:scripts/prepare-aria-namespace-candidate.py" > "$checkout/.git-audit/prepare-aria-namespace-candidate.py"
            # The historical script demands a clean checkout.
            # Its ROOT resolves to the checkout, so put it in an ignored directory.
            # Exclude the audit helper via local info/exclude only.
            exclude="$(git -C "$checkout" rev-parse --git-path info/exclude)"
            case "$exclude" in /*) ;; *) exclude="$checkout/$exclude";; esac
            printf '\n/.git-audit/\n' >> "$exclude"
            # Lossless decoding for legacy text with non-UTF8 bytes.
            # ASCII namespace substitutions are byte-preserving elsewhere.
            python3 - "$checkout/.git-audit/prepare-aria-namespace-candidate.py" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = 'full.read_bytes().decode("utf-8")'
          new = 'full.read_bytes().decode("utf-8", errors="surrogateescape")'
          write = 'write_bytes(content.encode("utf-8"))'
          assert s.count(old) == 1 and s.count(write) == 1
          s = s.replace(old, new).replace(write, 'write_bytes(content.encode("utf-8", errors="surrogateescape"))')
          p.write_text(s)
          PY
            python3 "$checkout/.git-audit/prepare-aria-namespace-candidate.py" --output "$report/namespace-$label" >&2 || return 1
            test -s "$report/namespace-$label/namespace-review.txt" || return 1
            test -s "$report/namespace-$label/aria-namespace.patch" || return 1
            local result
            result="$(git -C "$checkout" write-tree)" || return 1
            test "$result" != "$(git rev-parse "$source^{tree}")" || return 1
            test -z "$(git -C "$checkout" ls-files -- ':(glob)app/**/com/music/bitchord/**' ':(glob)shared/**/com/music/bitchord/**' ':(glob)sharedUi/**/com/music/bitchord/**')" || return 1
            printf 'Normalized %s tree %s\n' "$label" "$result" >&2
            printf '%s\n' "$result"
          }
          ancestor_tree="$(normalize "$ancestor" ancestor)" || exit 1
          idm_tree="$(normalize "$IDM_SHA" candidate)" || exit 1
          printf 'Normalized ancestor tree %s\nNormalized IDM tree %s\n' "$ancestor_tree" "$idm_tree" | tee -a "$report/status.txt"
          # Model the normalized IDM delta with the normalized ancestor as its
          # parent. The final real integration still requires both true heads.
          normalized_ancestor="$(printf 'audit normalized ancestor\n' | git commit-tree "$ancestor_tree")"
          normalized_idm="$(printf 'audit normalized IDM\n' | git commit-tree "$idm_tree" -p "$normalized_ancestor")"
          normalized_aria="$(printf 'audit Aria current tree\n' | git commit-tree "$(git rev-parse "$ARIA_SHA^{tree}")" -p "$normalized_ancestor")"
          set +e
          git merge-tree --write-tree --name-only "$normalized_aria" "$normalized_idm" > "$report/normalized-merge.txt"
          norm_status=$?
          set -e
          test "$norm_status" -le 1
          printf 'Normalized merge status: %s\n' "$norm_status" | tee -a "$report/status.txt"
          python3 - "$report" <<'PY'
          from pathlib import Path
          from collections import Counter
          import re, sys
          report = Path(sys.argv[1])
          for name in ("raw", "normalized"):
              lines = (report / f"{name}-merge.txt").read_text().splitlines()
              counts = Counter(m[1] for l in lines if (m := re.match(r"^CONFLICT \(([^)]+)\):", l)))
              summary = f"{name}: {sum(counts.values())} conflict messages; {dict(counts)}"
              print(summary)
              with (report / "status.txt").open("a") as out:
                  out.write(summary + "\n")
          PY
          # Publish paths and conflict classes, never private credential values,
          # source contents, or a remotely promoted merge.
          {
            echo '### Pinned integration audit'
            cat "$report/pinned.txt" "$report/status.txt"
            echo
            echo '#### Conflict paths after normalization'
            grep -E '^CONFLICT|^Auto-merging' "$report/normalized-merge.txt" || true
          } >> "$GITHUB_STEP_SUMMARY"
          # Materialize the normalized merge in a disposable worktree.
          candidate="$RUNNER_TEMP/idm-aria-resolve"
          git worktree add --detach "$candidate" "$normalized_aria"
          set +e
          git -C "$candidate" merge --no-commit --no-ff "$normalized_idm"
          merge_status=$?
          set -e
          test "$merge_status" = 1
          python3 - "$candidate" "$report" <<'PY'
          from pathlib import Path
          import subprocess, sys
          root, report = map(Path, sys.argv[1:])
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args])
          def conflicts():
              return set(git("diff", "--name-only", "--diff-filter=U", "-z").decode().strip("\0").split("\0")) - {""}
          def stage(path, side, replacements=()):
              assert path in conflicts(), path
              data = git("show", f":{side}:{path}").decode("utf-8")
              for old, new, count in replacements:
                  assert data.count(old) == count, (path, old, data.count(old))
                  data = data.replace(old, new)
              (root / path).write_bytes(data.encode("utf-8"))
              git("add", "--", path)
          # IDM copy contains the approved shorter download labels and
          # Navidrome naming. Apply only the new Aria brand from MAIN.
          stage("app/src/main/res/values-pt/acquisition_destination.xml", 3, [
              ("Music/BitChord", "Music/Aria", 3)])
          stage("app/src/main/res/values/acquisition_destination.xml", 3, [
              ("Music/BitChord", "Music/Aria", 3)])
          stage("app/src/main/res/values/strings_opensubsonic.xml", 3, [
              ("BitChord", "Aria", 2)])
          # Preserve IDM's cancellable OkHttp implementation plus Aria UA,
          # rate-limit error, log tag and human-facing branding.
          stage("app/src/main/java/com/music/aria/data/sources/addon/AddonClient.kt", 3, [
              ("BitChord", "Aria", 5)])
          # MAIN carries the approved geometry and stronger inset test.
          stage("app/src/test/java/com/music/aria/HomeSettingsOverflowAlignmentTest.kt", 2)
          stage("app/src/main/java/com/music/aria/ui/components/FrostedTopBar.kt", 2, [
              (".height(FloatingTopChromeHostHeight),",
               '.height(FloatingTopChromeHostHeight)\n                .testTag("native-global-floating-chrome-host"),', 1)])
          # Both inputs already import testTag, verify rather than guess.
          bar = (root / "app/src/main/java/com/music/aria/ui/components/FrostedTopBar.kt").read_text()
          assert "import androidx.compose.ui.platform.testTag" in bar
          expected = {
              "app/src/main/java/com/music/aria/MainActivity.kt",
              "app/src/main/java/com/music/aria/playback/PlaybackService.kt",
              "app/src/main/java/com/music/aria/ui/screens/SettingsNavigation.kt",
              "app/src/main/java/com/music/aria/ui/screens/SettingsSheet.kt",
          }
          assert conflicts() == expected, (conflicts(), expected)
          # Expose only conflicting hunks plus a few surrounding lines.
          # No source credentials, no push or promoted merge.
          blocks = []
          for path in sorted(expected):
              lines = (root / path).read_text().splitlines()
              starts = [i for i, line in enumerate(lines) if line.startswith("<<<<<<<")]
              ends = [i for i, line in enumerate(lines) if line.startswith(">>>>>>>")]
              assert len(starts) == len(ends) and starts, path
              blocks.append(f"=== {path}: {len(starts)} hunks ===")
              for start, end in zip(starts, ends):
                  assert start < end
                  blocks.append(f"--- lines {start+1}-{end+1} ---")
                  blocks.extend(lines[max(0,start-5):end+6])
          (report / "remaining-hunks.txt").write_text("\n".join(blocks) + "\n")
          print("Reviewed resolutions: 6; unresolved: 4")
          print("\n".join(blocks))
          PY
          git -C "$candidate" diff --cached --stat > "$report/staged-stat.txt"
          git -C "$candidate" diff --cached --check -- app/src/main/res/values-pt/acquisition_destination.xml app/src/main/res/values/acquisition_destination.xml app/src/main/res/values/strings_opensubsonic.xml app/src/main/java/com/music/aria/data/sources/addon/AddonClient.kt app/src/main/java/com/music/aria/ui/components/FrostedTopBar.kt app/src/test/java/com/music/aria/HomeSettingsOverflowAlignmentTest.kt
      - name: Reconcile remaining four semantic conflicts
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/idm-aria-resolve"
          report="$RUNNER_TEMP/idm-aria-audit"
          python3 - "$candidate" "$report" <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          root, report = map(Path, sys.argv[1:])
          def git(*args):
              return subprocess.check_output(["git", "-C", str(root), *args])
          # Each resolution checks the expected hunk contents, rather than
          # accepting an entire side of a conflicted production file.
          pattern = re.compile(r"^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]+\n", re.M | re.S)
          def resolve(path, rules, post=lambda x: x):
              file = root / path
              source = file.read_text()
              found = list(pattern.finditer(source))
              assert len(found) == len(rules), (path, len(found), len(rules))
              for match, (left_hint, right_hint, choose) in reversed(list(zip(found, rules))):
                  left, right = match.groups()
                  assert left_hint in left and right_hint in right, (path, left_hint, right_hint)
                  source = source[:match.start()] + choose(left, right) + source[match.end():]
              source = post(source)
              assert not pattern.search(source), path
              file.write_text(source)
              git("add", "--", path)
          def lines_without(text, *tokens):
              return "".join(line for line in text.splitlines(keepends=True) if not any(token in line for token in tokens))
          def no_account_or_wear(left, right):
              return lines_without(right, "showWearOs", "showAccountSelector")
          def strip_wear_condition(text):
              return text.replace(" && !showWearOs", "").replace("!showWearOs && ", "")
          def main_post(text):
              # One closing callback brace was outside its conflict marker.
              # The retired settings row has no replacement callback.
              old = '                                showSources = true\n                            },\n                            },\n                            onSpotifyCanvasAuth'
              new = '                                showSources = true\n                            },\n                            onSpotifyCanvasAuth'
              assert text.count(old) == 1, "Expected orphaned settings callback"
              text = text.replace(old, new)
              # Keep the local Composable extraction required to stay below
              # JVM method size; no account selector from the old Google flow.
              text, count = re.subn(r'(?m)^            if \(showAccountSelector\) \{\n.*?^            \}\n', '', text, flags=re.S)
              assert count == 1, ("legacy selector", count)
              # Its declarations may survive a clean textual merge.
              text = lines_without(text, "val showAccountSelector:", "showAccountSelector = remember",
                                   "val showWearOs:", "showWearOs = remember")
              return text
          resolve("app/src/main/java/com/music/aria/MainActivity.kt", [
              ("showAccountScrobbling by rememberSaveable", "showAccountScrobbling by mainVisibility", no_account_or_wear),
              ("librarySortMenuOpen by remember", "librarySortMenuOpen by mainVisibility", no_account_or_wear),
              ("onAccountScrobbling", "onSignIn", lambda l,r: ""),
              ("onSoulseek", "onWearOs", lambda l,r: ""),
              ("val chromePageColor", "val appleDetailPalette", lambda l,r: strip_wear_condition(r)),
              ("WelcomeOnboardingOverlay(visibleState", "fun LegacyFullWindowOverlays()", lambda l,r:
                  r[:r.index("            WelcomeOnboardingOverlay(")] +
                  "            WelcomeOnboardingOverlay(visibleState = onboardingShown)\n"),
              ("LanguageSettingsOverlays", "FrostedFolderMenu", lambda l,r: r),
          ], main_post)
          resolve("app/src/main/java/com/music/aria/playback/PlaybackService.kt", [
              ("mediaSourceFactory = DefaultMediaSourceFactory", "val buildSourceTransport", lambda l,r:
                  lines_without(r, "WearBridge.attachStreams", "// The watch, when it is the speaker")),
          ])
          resolve("app/src/main/java/com/music/aria/ui/screens/SettingsNavigation.kt", [
              ("onListenTogether", "showWear", lambda l,r: ""),
          ])
          resolve("app/src/main/java/com/music/aria/ui/screens/SettingsSheet.kt", [
              ("onAccountScrobbling", "signedIn", lambda l,r: ""),
              ("onSoulseek", "onWearOs", lambda l,r: ""),
              ("onListenTogether", "WatchInstaller", lambda l,r: ""),
              ("SettingsSection.ACCOUNT", "", lambda l,r: ""),
          ])
          assert not git("ls-files", "-u").strip(), "Unmerged index"
          # Normalize the newly introduced IDM workflow selectors as well:
          # the historical migration intentionally only touched modules.
          workflow = root / ".github/workflows/idm-catalog-feeding-measurements.yml"
          source = workflow.read_text()
          for old,new in (("com.music.bitchord","com.music.aria"),
                          ("com/music/bitchord","com/music/aria"),
                          ("com_music_bitchord","com_music_aria")):
              source = source.replace(old,new)
          workflow.write_text(source)
          git("add", "--", str(workflow.relative_to(root)))
          # The three one-off pre-namespace integration workflows have
          # already fulfilled their pinned purpose. Retire them in the
          # candidate rather than re-enable obsolete remote-writing recipes.
          for name in ("idm-main-integration.yml",
                       "idm-rea-topbar-integration.yml",
                       "provider-rea-integration-preflight.yml"):
              path = ".github/workflows/" + name
              assert (root / path).is_file(), path
              # These exact obsolete files were introduced by the staged merge.
              # Their removal is intentional and restricted to this worktree.
              assert not git("ls-files", "-u", "--", path).strip(), path
              assert not git("diff", "--", path).strip(), path
              git("rm", "-f", "--", path)
              assert not (root / path).exists(), path
          # Reconcile the entire approved nominal-symbol family in one pass,
          # not just the first failure from the identity gate. These are
          # exact lexical identifiers, not storage keys, URIs or credentials.
          symbols = {
              b"BitChordApp": b"AriaApp",
              b"BitChordApplication": b"AriaApplication",
              b"BitChordIcons": b"AriaIcons",
              b"BitChordTheme": b"AriaTheme",
              b"BitChordTypography": b"AriaTypography",
          }
          symbol_rx = re.compile(rb"\b(?:" + b"|".join(symbols) + rb")\b")
          changed = []
          counts = dict.fromkeys(symbols, 0)
          for name in git("ls-files", "-z").decode().split("\0"):
              if not name.startswith(("app/", "shared/", "sharedUi/")) or not name.endswith(".kt"):
                  continue
              file = root / name
              raw = file.read_bytes()
              hits = symbol_rx.findall(raw)
              if hits:
                  for hit in hits:
                      counts[hit] += 1
                  file.write_bytes(symbol_rx.sub(lambda m: symbols[m.group()], raw))
                  git("add", "--", name)
                  changed.append(f"{name}: {len(hits)}")
          for required in (b"BitChordApp", b"BitChordApplication", b"BitChordIcons", b"BitChordTheme"):
              assert counts[required] > 0, ("expected observed symbol", required)
          print("Approved identity symbols reconciled:", *changed, sep="\n")
          print("Symbol counts:", {key.decode(): value for key,value in counts.items()})
          tree = git("write-tree").decode().strip()
          print("Resolved candidate tree:", tree)
          (report / "resolved-tree.txt").write_text(tree + "\n")
          # Inspect newly reintroduced contracts and their locations.
          # No attempt to silently delete functionality on the basis of a
          # regex: an identity finding must be reviewed in context.
          rx = re.compile(r"\b(?:WearBridge|WatchInstaller|WatchOutputState|WatchOutputUi|WatchEntry|WatchUpdateState|WatchPairingState|WatchAppStatus|WearCommandService|WatchSpeaker|WearOsScreen|WearOsSettingsRow|showWearOs|onWearOs|refreshWatchOutput|selectWatchOutput|leaveWatchOutput|setWatchVolume|watchOutput|watchSpeaker|WATCH_SESSION_FOREGROUND_MS|AccountProfileSelector|showAccountSelector|googleAccounts|activeAccountId|activeProfileId|GoogleAccount|BitChordApp)\b|\bSettingsSection\.WEAR\b")
          findings = []
          for name in git("ls-files", "-z").decode().split("\0"):
              if not name.startswith(("app/","shared/","sharedUi/")) or not name.endswith(".kt"):
                  continue
              for i,line in enumerate((root / name).read_text(errors="surrogateescape").splitlines(),1):
                  hits = sorted(set(m.group() for m in rx.finditer(line)))
                  if hits:
                      findings.append(f"{name}:{i}: {', '.join(hits)}")
          (report / "candidate-contract-inventory.txt").write_text("\n".join(findings)+"\n")
          print("Candidate contract inventory:")
          print("\n".join(findings))
          PY
          git -C "$candidate" diff --cached --stat > "$report/resolved-stat.txt"
          # Gate on exact candidate, not the workflow's original checkout.
          cd "$candidate"
          python3 scripts/verify-aria-android-identity.py > "$report/identity-gate.txt" 2>&1 || {
            tail -n 35 "$report/identity-gate.txt"
            exit 1
          }
          tail -n 10 "$report/identity-gate.txt"
      - name: Verify every new MAIN branding change survives unchanged
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/idm-aria-resolve"
          old_main=cc8e525843a984b56e7d5e9f29f362141abc7a70
          new_main=58d8d9143fa04302cb3356df510e77c76a2eae57
          candidate_tree="$(cat "$RUNNER_TEMP/idm-aria-audit/resolved-tree.txt")"
          git merge-base --is-ancestor "$old_main" "$new_main"
          mapfile -d '' updated < <(git diff --name-only -z "$old_main" "$new_main")
          test "${#updated[@]}" -gt 0
          for path in "${updated[@]}"; do
            git diff --quiet "$new_main" "$candidate_tree" -- "$path" || {
              echo "::error::New MAIN change not preserved: $path"
              exit 1
            }
          done
          printf 'All %s newly changed MAIN paths match exactly.\n' "${#updated[@]}"
      - name: Retrieve previously approved integrated tree for exact delta verification
        uses: actions/download-artifact@v4
        with:
          name: sealed-idm-aria-candidate
          run-id: 45844770994
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior-sealed-idm
      - name: Prove the only changes from the previous approved tree are the five Master-budget files
        shell: bash
        run: |
          set -euo pipefail
          # Reconstruct the prior tree by importing the preserved bundle
          # through a separate read-only artifact download below.
          cd "$RUNNER_TEMP/idm-aria-resolve"
          old=e16bf6764d97fdb5c1dcafa44235a6dd156f102c
          prior_tree=1954dec45b353e7769ab0acf8d1fae6017fe610f
          bundle="$RUNNER_TEMP/prior-sealed-idm/sealed-candidate.bundle"
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/sealed-idm-aria-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$old"
          test "$(git rev-parse "$old^{tree}")" = "$prior_tree"
          current="$(git write-tree)"
          git diff --name-only "$prior_tree" "$current" | sort > "$RUNNER_TEMP/idm-actual-delta.txt"
          printf '%s\n' \
            app/src/main/java/com/music/aria/data/catalog/metadata/discogs/DiscogsClient.kt \
            app/src/main/java/com/music/aria/data/catalog/metadata/discogs/DiscogsEvidence.kt \
            app/src/test/java/com/music/aria/DiscogsEvidenceContractTest.kt \
            app/src/test/java/com/music/aria/DiscogsMasterContractTest.kt \
            app/src/test/java/com/music/aria/DiscogsTransportSafetyTest.kt | sort > "$RUNNER_TEMP/idm-expected-delta.txt"
          diff -u "$RUNNER_TEMP/idm-expected-delta.txt" "$RUNNER_TEMP/idm-actual-delta.txt"
          git diff --stat "$prior_tree" "$current"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Compile and test the resolved candidate (no smoke)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/idm-aria-resolve"
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache :app:testDevDebugUnitTest :sharedUi:jvmTest
      - name: Seal the tested tree with both real parents
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/idm-aria-resolve"
          report="$RUNNER_TEMP/idm-aria-audit"
          tree="$(cat "$report/resolved-tree.txt")"
          test "$(git write-tree)" = "$tree"
          # Gradle may generate ignored build files, but may not modify tracked source.
          git diff --exit-code
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          for location in ("app/build/test-results/testDevDebugUnitTest", "sharedUi/build/test-results/jvmTest"):
              cases = [case for file in Path(location).glob("TEST-*.xml")
                       for case in ET.parse(file).getroot().iter("testcase")]
              assert cases, f"No test evidence in {location}"
              failed = sum(any(case.find(tag) is not None for tag in ("failure", "error")) for case in cases)
              skipped = sum(case.find("skipped") is not None for case in cases)
              assert failed == 0 and skipped < len(cases), (location, failed, skipped)
              print(f"{location}: {len(cases)} tests, {failed} failed, {skipped} skipped")
          PY
          main=58d8d9143fa04302cb3356df510e77c76a2eae57
          idm=6efa91fb6dd2c2ad2a35897946aaf01e8812851a
          candidate="$(printf 'integration(idm): reconcile provider engine with Aria identity and current launcher branding\n\nValidated identity, Android and sharedUI unit suites in isolated CI. No physical smoke or MAIN merge.\n' | git commit-tree "$tree" -p "$main" -p "$idm")"
          test "$(git rev-parse "$candidate^{tree}")" = "$tree"
          test "$(git show -s --format=%P "$candidate")" = "$main $idm"
          git update-ref refs/heads/sealed-idm-aria-candidate "$candidate"
          git bundle create "$report/sealed-candidate.bundle" refs/heads/sealed-idm-aria-candidate "^$main" "^$idm"
          printf '%s\n' "$candidate" > "$report/sealed-commit.txt"
          echo "Sealed candidate $candidate (tree $tree)"
      - name: Upload tested candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: sealed-idm-aria-candidate-master-budget
          path: |
            ${{ runner.temp }}/idm-aria-audit/sealed-candidate.bundle
            ${{ runner.temp }}/idm-aria-audit/sealed-commit.txt
            ${{ runner.temp }}/idm-aria-audit/resolved-tree.txt
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose candidate test failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/idm-aria-resolve" <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import sys
          root = Path(sys.argv[1])
          for directory in ("app/build/test-results/testDevDebugUnitTest", "sharedUi/build/test-results/jvmTest"):
              for file in sorted((root / directory).glob("TEST-*.xml")):
                  for case in ET.parse(file).getroot().iter("testcase"):
                      for tag in ("failure", "error"):
                          problem = case.find(tag)
                          if problem is not None:
                              print(case.get("classname"), case.get("name"), problem.get("message"))
                              print((problem.text or "")[:2000])
          PY
      - name: Archive path-only analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-aria-integration-conflicts
          path: |
            ${{ runner.temp }}/idm-aria-audit/pinned.txt
            ${{ runner.temp }}/idm-aria-audit/status.txt
            ${{ runner.temp }}/idm-aria-audit/idm-paths.txt
            ${{ runner.temp }}/idm-aria-audit/aria-paths.txt
            ${{ runner.temp }}/idm-aria-audit/raw-merge.txt
            ${{ runner.temp }}/idm-aria-audit/normalized-merge.txt
            ${{ runner.temp }}/idm-aria-audit/remaining-hunks.txt
            ${{ runner.temp }}/idm-aria-audit/staged-stat.txt
            ${{ runner.temp }}/idm-aria-audit/resolved-tree.txt
            ${{ runner.temp }}/idm-aria-audit/resolved-stat.txt
            ${{ runner.temp }}/idm-aria-audit/candidate-contract-inventory.txt
            ${{ runner.temp }}/idm-aria-audit/identity-gate.txt
            ${{ runner.temp }}/idm-aria-audit/namespace-*/namespace-review.txt
          if-no-files-found: error

