name: Aria namespace migration candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-namespace-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'jssantogit/Aria' && ((github.event_name == 'pull_request' && github.head_ref == 'feat/aria-identity-notation-2.1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/aria-identity-notation-2.1'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact identity branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare isolated namespace candidate and review inventory
        run: python3 scripts/prepare-aria-namespace-candidate.py --output "${RUNNER_TEMP}/aria-namespace-candidate"

      - name: Upload candidate patch and compatibility review inventory
        uses: actions/upload-artifact@v4
        with:
          name: aria-namespace-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aria-namespace-candidate/
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact identity branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Retrieve exact candidate patch
        uses: actions/download-artifact@v4
        with:
          name: aria-namespace-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aria-namespace-candidate

      - name: Apply and verify candidate tree
        run: |
          set -eu
          candidate="$RUNNER_TEMP/aria-namespace-candidate"
          test "$(git rev-parse HEAD)" = "$(cat "$candidate/source-head.txt")"
          git apply --index --whitespace=nowarn "$candidate/aria-namespace.patch"
          test "$(git write-tree)" = "$(cat "$candidate/candidate-tree.txt")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check migrated structural contracts
        run: python3 scripts/verify-aria-android-identity.py

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_SECRET" > local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run candidate Android and shared tests
        run: |
          ./gradlew --build-cache :app:testDevDebugUnitTest
          ./gradlew --build-cache :shared:jvmTest --tests "com.music.aria.playback.smart.AdvancedAutomixPlannerTest"
          ./gradlew --build-cache :sharedUi:jvmTest

      - name: Build candidate APK including JNI
        run: ./gradlew --build-cache :app:assembleDevDebug

      - name: Upload candidate test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aria-namespace-candidate-test-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3

  publish-review-branch:
    # One-shot handoff: only this specific authorized transition, same-repo
    # identity PR, never main or the identity branch itself.
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before == '6cafd5782d5eab0ab425eca841eacb5463a73fba' && github.repository == 'jssantogit/Aria' && github.event.pull_request.number == 234 && github.head_ref == 'feat/aria-identity-notation-2.1' && github.event.pull_request.head.repo.full_name == github.repository
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact identity branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Retrieve exact candidate patch
        uses: actions/download-artifact@v4
        with:
          name: aria-namespace-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/aria-namespace-candidate

      - name: Publish unvalidated review commit to isolated branch
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          candidate="$RUNNER_TEMP/aria-namespace-candidate"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$(cat "$candidate/source-head.txt")"
          git apply --index --whitespace=nowarn "$candidate/aria-namespace.patch"
          test "$(git write-tree)" = "$(cat "$candidate/candidate-tree.txt")"
          # Do not grant repository code access to the write credential.
          # Only Git built-ins run here; no Gradle or candidate scripts.
          git diff --cached --name-only --no-renames -z | python3 -c 'import sys; paths=sys.stdin.buffer.read().split(b"\x00"); sys.exit(0 if all(p.startswith((b"app/",b"shared/",b"sharedUi/")) for p in paths if p) else 1)'
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" -c core.hooksPath=/dev/null commit -m "Migrate Aria Android source namespace (unvalidated review candidate)"
          git push origin "HEAD:refs/heads/review/aria-namespace-$SOURCE_SHA"
          git rev-parse HEAD
