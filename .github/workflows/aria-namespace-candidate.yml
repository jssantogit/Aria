name: Aria namespace migration candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-namespace-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'jssantogit/Aria' && ((github.event_name == 'pull_request' && github.head_ref == 'feat/aria-identity-notation-2.1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/aria-identity-notation-2.1'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact identity branch HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prepare isolated namespace candidate and review inventory
        run: python3 scripts/prepare-aria-namespace-candidate.py --output "${RUNNER_TEMP}/aria-namespace-candidate"

      - name: Upload candidate patch and compatibility review inventory
        uses: actions/upload-artifact@v4
        with:
          name: aria-namespace-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/aria-namespace-candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Check migrated structural contracts
        run: python3 scripts/verify-aria-android-identity.py

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_SECRET" > local.properties

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run candidate Android and shared tests
        run: |
          ./gradlew --build-cache :app:testDevDebugUnitTest
          ./gradlew --build-cache :shared:jvmTest --tests "com.music.aria.playback.smart.AdvancedAutomixPlannerTest"
          ./gradlew --build-cache :sharedUi:jvmTest

      - name: Build candidate APK including JNI
        run: ./gradlew --build-cache :app:assembleDevDebug

      - name: Upload candidate test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aria-namespace-candidate-test-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
