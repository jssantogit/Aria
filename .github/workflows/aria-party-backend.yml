name: Aria party backend tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - '.github/workflows/aria-party-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate Go backend
        run: go test ./...
      - name: Build independent server
        run: go build -o "$RUNNER_TEMP/aria-party-server" .
      - name: Check deployment scripts without deploying
        run: |
          bash -n deploy/setup.sh
          bash -n deploy/aria-deploy.sh
          python3 -m py_compile tools/jam_probe.py
