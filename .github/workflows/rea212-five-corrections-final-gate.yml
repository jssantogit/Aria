name: REA212 final five correction Android smoke gate
on:
  push:
    branches: [validation/rea212-five-corrections-4f5bccd-20261114]
permissions:
  contents: read
jobs:
  final-android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Validate release source identity
        run: |
          set -euo pipefail
          git diff --exit-code 4f5bccdace43b2d9b817b8fc7a20c61362617e21 HEAD -- app sharedUi shared
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused smoke regression tests
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.ui.screens.CanonicalLibrarySelectionExpandedActionsTest" --tests "com.music.bitchord.ui.screens.CanonicalHeldMenuPaletteSourceTest" --tests "com.music.bitchord.ui.components.PlayerAnchoredActionsHighlightTest" --tests "com.music.bitchord.CanonicalArtistDiscographyRetryTest" --tests "com.music.bitchord.ui.screens.CanonicalRatingAnchorRoutesTest" --tests "com.music.bitchord.ui.screens.NativeArtistRatingActionVisibilityTest"
      - name: Full Android suite
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Shared Automix
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :shared:jvmTest --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest"
      - name: Failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-five-corrections-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
