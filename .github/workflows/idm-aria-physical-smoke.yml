name: IDM · sealed Android physical smoke APK
on:
  push:
    branches: [audit/idm-aria-namespace-integration-20261126]
    paths: [.github/workflows/idm-aria-physical-smoke.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: idm-aria-physical-smoke
  cancel-in-progress: false
jobs:
  android-smoke:
    name: Build exact sealed candidate only after live approval
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Require exact successful Home gate and unchanged parent refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          expected=eb9835ac266ed640b0fd01acce4ef942e611db0c
          runs="$(gh api "repos/$repo/actions/workflows/idm-aria-final-home-validation.yml/runs?head_sha=$expected&event=push&per_page=100")"
          run="$(jq -ce --arg sha "$expected" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "audit/idm-aria-namespace-integration-20261126" and .event == "push")] | sort_by(.id) | last // error("Exact Home gate not found")' <<< "$runs")"
          id="$(jq -r '.id' <<< "$run")"
          status="$(jq -r '.status' <<< "$run")"
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          echo "Home gate: $id $status $conclusion"
          echo "Home gate: https://github.com/$repo/actions/runs/$id — $status / $conclusion" >> "$GITHUB_STEP_SUMMARY"
          test "$status" = completed
          test "$conclusion" = success
          gh api "repos/$repo/actions/runs/$id/jobs?per_page=100" | jq -e '[.jobs[] | select(.name == "Final bounded Home observations" and .conclusion == "success") | .steps[] | select(.name == "Gate on observed Home completeness and original capacity budgets" and .conclusion == "success")] | length == 1'
          gh api "repos/$repo/actions/runs/$id/artifacts?per_page=100" | jq -e '[.artifacts[] | select(.name == "idm-final-home-80c18bf6" and .expired == false)] | length == 1'
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" = 58d8d9143fa04302cb3356df510e77c76a2eae57
          test "$(gh api "repos/$repo/git/ref/heads/integration/idm-providers-main-20261121" --jq '.object.sha')" = 6efa91fb6dd2c2ad2a35897946aaf01e8812851a
          echo "HOME_GATE_RUN=$id" >> "$GITHUB_ENV"
      - name: Checkout audit source with complete parent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve the already validated candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: sealed-idm-aria-candidate-master-budget
          run-id: 45913908332
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sealed-idm
      - name: Verify exact candidate object and checked out tree
        shell: bash
        run: |
          set -euo pipefail
          expected=80c18bf6ca143aeaa5b1b7343e3393c299d0908a
          tree=3764b4af33231b977d9748ba80f7d6326f4f8e48
          main=58d8d9143fa04302cb3356df510e77c76a2eae57
          idm=6efa91fb6dd2c2ad2a35897946aaf01e8812851a
          sealed="$RUNNER_TEMP/sealed-idm"
          test "$(cat "$sealed/sealed-commit.txt")" = "$expected"
          test "$(cat "$sealed/resolved-tree.txt")" = "$tree"
          git bundle verify "$sealed/sealed-candidate.bundle"
          git fetch "$sealed/sealed-candidate.bundle" refs/heads/sealed-idm-aria-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git show -s --format=%P "$expected")" = "$main $idm"
          test "$(git rev-parse "$expected^{tree}")" = "$tree"
          git checkout --detach "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "Exact sealed source: $expected (tree $tree)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble existing devDebug flavor without provider or UI changes
        shell: bash
        run: |
          set -euo pipefail
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon --build-cache :app:assembleDevDebug
      - name: Verify exact source, ARM64 APK, package and debug signature
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 80c18bf6ca143aeaa5b1b7343e3393c299d0908a
          git diff --exit-code
          git diff --cached --exit-code
          mapfile -t apks < <(find app/build/outputs/apk/dev/debug -maxdepth 1 -type f -name '*arm64-v8a*.apk')
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          apksigner="$(dirname "$aapt")/apksigner"
          test -x "$aapt"
          test -x "$apksigner"
          "$aapt" dump badging "$apk" > "$RUNNER_TEMP/idm-badging.txt"
          grep -Fq "package: name='com.dev.aria'" "$RUNNER_TEMP/idm-badging.txt"
          grep -Fq "application-debuggable" "$RUNNER_TEMP/idm-badging.txt"
          grep -Fq "native-code: 'arm64-v8a'" "$RUNNER_TEMP/idm-badging.txt"
          "$apksigner" verify "$apk"
          mkdir -p idm-smoke
          cp "$apk" idm-smoke/Aria-IDM-Smoke-arm64-v8a.apk
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "home_gate_run=$HOME_GATE_RUN"
            echo "package=com.dev.aria"
            echo "variant=devDebug"
            echo "physical_smoke=not_executed"
            (cd idm-smoke && sha256sum *.apk)
          } > idm-smoke/manifest.txt
          cat idm-smoke/manifest.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve installable test APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: aria-idm-smoke-arm64-80c18bf6
          path: idm-smoke/
          if-no-files-found: error
          retention-days: 14
