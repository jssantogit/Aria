name: AMS · track genre and hero evidence
on:
  push:
    branches: [audit/ams-native-visual-parity-20261126]
    paths:
      - '.github/workflows/ams-track-genre-hero-live.yml'
      - 'app/src/test/java/com/music/bitchord/AmsTrackGenreAndHeroLiveTest.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ams-track-genre-hero-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    strategy:
      fail-fast: false
      matrix:
        method: [allRegisteredStylesFromSongMetadata, officialEditorialArtworkFields, officialPlaylistArtworkFields]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMS_TRACK_HERO_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run evidence contract
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AmsTrackGenreAndHeroLiveTest.${{ matrix.method }}'
      - name: Report observations
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('app/build/test-results/testDevDebugUnitTest').glob('*AmsTrackGenreAndHeroLiveTest.xml'))
          assert len(files)==1
          root=ET.parse(files[0]).getroot()
          assert int(root.attrib['tests'])==1 and int(root.attrib['skipped'])==0
          for node in root.iter('system-out'):
              for line in (node.text or '').splitlines():
                  if line.startswith(('AMS_TRACK_GENRE|','AMS_HERO|')): print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-track-hero-${{ matrix.method }}-${{ github.sha }}
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
