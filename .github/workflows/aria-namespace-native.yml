name: Aria namespace native build

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aria-namespace-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    if: github.repository == 'jssantogit/Aria' && ((github.event_name == 'pull_request' && github.head_ref == 'feat/aria-identity-notation-2.1' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/aria-identity-notation-2.1'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out migrated exact HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify migrated namespace
        run: python3 scripts/verify-aria-android-identity.py
      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          printf 'LASTFM_API_KEY=%s\nLASTFM_SECRET=%s\n' "$LASTFM_API_KEY" "$LASTFM_SECRET" > local.properties
      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew
      - name: Assemble Android APK including JNI
        run: ./gradlew --build-cache :app:assembleDevDebug
      - name: Verify packaged native library identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          required = {"libaria_analysis.so", "libaria_dsd.so", "libaria_dst.so"}
          retired = {"libbitchord_analysis.so", "libbitchord_dsd.so", "libbitchord_dst.so"}
          apks = sorted(Path("app/build/outputs/apk/dev/debug").glob("*.apk"))
          assert apks, "No APK produced"
          supported = {"armeabi-v7a", "arm64-v8a", "x86_64"}
          checked = 0
          observed = set()
          for apk in apks:
              with ZipFile(apk) as archive:
                  libs = {}
                  for name in archive.namelist():
                      parts = name.split("/")
                      if len(parts) == 3 and parts[0] == "lib" and parts[2].endswith(".so"):
                          libs.setdefault(parts[1], set()).add(parts[2])
                  expected = supported if "universal" in apk.name else {abi for abi in supported if abi in apk.name}
                  assert expected, f"Unknown APK ABI: {apk.name}"
                  for abi, names in libs.items():
                      assert not retired & names, f"{apk.name}/{abi}: retired native library"
                  for abi in expected:
                      names = libs.get(abi, set())
                      assert required <= names, f"{apk.name}/{abi}: missing {required - names}"
                      observed.add(abi)
                      checked += 1
          assert observed == supported, f"Missing supported ABIs: {supported - observed}"
          print(f"Verified Aria native library names across {checked} packaged APK/ABI pairs")
          PY
      - name: Upload migrated development APK
        uses: actions/upload-artifact@v4
        with:
          name: aria-namespace-dev-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 7
