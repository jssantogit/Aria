name: REA212 native artist and frosted cards acceptance
on:
  push:
    branches: [validation/rea212-native-artist-frosted-final-ec73de1-20261114]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Verify exact final production and test source
        run: |
          set -euo pipefail
          git diff --exit-code ec73de14978957e879ff1dc0703d06cf0f20e498 HEAD -- app sharedUi shared
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure build properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused identity and rating regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.ui.components.PlayerArtistEvidenceTest" --tests "com.music.bitchord.ui.screens.NativeRatingEditorActionTest" --tests "com.music.bitchord.ui.screens.CanonicalRatingAnchorRoutesTest" --tests "com.music.bitchord.ui.screens.CanonicalLibrarySelectionExpandedActionsTest" --tests "com.music.bitchord.ui.components.PlayerAnchoredActionsHighlightTest"
      - name: Full Android suite
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Shared Automix
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :shared:jvmTest --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest"
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-artist-rating-frosted-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
