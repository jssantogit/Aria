name: REA212 five screenshots Android full acceptance
on:
  push:
    branches: [validation/rea212-five-smoke-full-a01b39b-20261114]
permissions:
  contents: read
jobs:
  android-and-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Confirm exact acceptance snapshot
        run: |
          set -euo pipefail
          git diff --exit-code a01b39bb195a83b3aae5b6aa028f0095c4859817 HEAD -- app shared sharedUi
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure local properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          chmod +x gradlew
      - name: Focused menu rating palette and NewJeans regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.ui.screens.CanonicalLibrarySelectionExpandedActionsTest" --tests "com.music.bitchord.ui.screens.PlaylistNativeSheetReuseTest" --tests "com.music.bitchord.ui.screens.CanonicalHeldMenuPaletteSourceTest" --tests "com.music.bitchord.ui.components.PlayerAnchoredActionsHighlightTest" --tests "com.music.bitchord.CanonicalArtistDiscographyRetryTest" --tests "com.music.bitchord.ui.screens.CanonicalRatingAnchorRoutesTest" --tests "com.music.bitchord.ui.screens.NativeArtistRatingActionVisibilityTest"
      - name: Full Android unit regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest
      - name: Shared UI JVM suite
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest
      - name: Shared Automix regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :shared:jvmTest --tests "com.music.bitchord.playback.smart.AdvancedAutomixPlannerTest"
      - name: Failed reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rea212-screenshots-full-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 3
