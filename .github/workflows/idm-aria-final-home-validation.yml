name: IDM · final sealed Home validation · MusicBrainz and Discogs
on:
  push:
    branches: [audit/idm-aria-namespace-integration-20261126]
    paths: [.github/workflows/idm-aria-final-home-validation.yml]
permissions:
  contents: read
  actions: read
jobs:
  live-observation:
    name: Final bounded Home observations
    concurrency:
      group: idm-catalog-live-full
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IDM_CATALOG_LIVE: '1'
      IDM_CATALOG_LIVE_SCOPE: 'full'
      IDM_CATALOG_DISCOGS_CAPACITY_TARGET: '100'
      IDM_CATALOG_METRICS_DIR: ${{ github.workspace }}/idm-catalog-live-metrics
      IDM_CATALOG_DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
      IDM_SEARCH_TOP10_REVIEW: '0'
    steps:
      - name: Checkout audit source with complete parent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve the already validated candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: sealed-idm-aria-candidate-master-budget
          run-id: 45913908332
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sealed-idm
      - name: Verify exact candidate object and checked out tree
        shell: bash
        run: |
          set -euo pipefail
          expected=80c18bf6ca143aeaa5b1b7343e3393c299d0908a
          tree=3764b4af33231b977d9748ba80f7d6326f4f8e48
          main=58d8d9143fa04302cb3356df510e77c76a2eae57
          idm=6efa91fb6dd2c2ad2a35897946aaf01e8812851a
          sealed="$RUNNER_TEMP/sealed-idm"
          test "$(cat "$sealed/sealed-commit.txt")" = "$expected"
          test "$(cat "$sealed/resolved-tree.txt")" = "$tree"
          git bundle verify "$sealed/sealed-candidate.bundle"
          git fetch "$sealed/sealed-candidate.bundle" refs/heads/sealed-idm-aria-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git show -s --format=%P "$expected")" = "$main $idm"
          test "$(git rev-parse "$expected^{tree}")" = "$tree"
          git checkout --detach "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "Exact sealed source: $expected (tree $tree)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare secretless base properties and isolated reports
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          mkdir -p "$IDM_CATALOG_METRICS_DIR"
          case "$IDM_CATALOG_LIVE_SCOPE" in full|itunes-albums|itunes-musicbrainz-search) ;; *) exit 1 ;; esac
          echo "Live scope: $IDM_CATALOG_LIVE_SCOPE (focused results are not full parity)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restrict existing observational harness to MusicBrainz and Discogs Home
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/test/java/com/music/aria/IdmCatalogLiveObservationTest.kt")
          s = p.read_text()
          start = s.index("    @Test fun live_sources_and_collective_fallback_use_canonical_pipeline()")
          apple = s.index("        val appleCaps = setOf(ProviderCapability.CATALOG_SEARCH,", start)
          discogs = s.index('        val token = System.getenv("IDM_CATALOG_DISCOGS_TOKEN")', apple)
          after = s.index("        // Exercise one REAL canonical genre scroll", discogs)
          end = s.index("        assertEquals(6, orders.size)", after)
          end = s.index("\n    }", end)
          p.write_text(s[:apple] + s[discogs:after] + s[end:])
          PY
          test "$(git diff --name-only)" = "app/src/test/java/com/music/aria/IdmCatalogLiveObservationTest.kt"
          git diff --check
      - name: Run one bounded live Home observation without iTunes
        run: |
          ./gradlew --no-daemon --build-cache :app:testDevDebugUnitTest \
            --tests 'com.music.aria.IdmCatalogLiveObservationTest.live_sources_and_collective_fallback_use_canonical_pipeline'
      - name: Gate on observed Home completeness and original capacity budgets
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          checks = {
              "musicbrainz_app_flow": ("verified", 1, 5),
              "musicbrainz_home_granular": ("verified", 1, None),
              "musicbrainz_home_capacity_30": ("target_reached", 30, 5),
              "discogs_home_landing": ("verified", 1, None),
              "discogs_home_granular": ("verified", 1, None),
              "discogs_home_capacity_30": ("target_reached", 30, None),
              "discogs_home_capacity_100": ("target_reached", 100, None),
          }
          failures = []
          for name, (status, minimum, genres) in checks.items():
              p = folder / f"live_{name}.json"
              if not p.is_file():
                  failures.append(name + ": missing")
                  continue
              row = json.loads(p.read_text())
              fields = ("status", "displayed_unique", "verified_landing_genres",
                        "source_gestures", "continuation_elapsed_ms", "elapsed_ms",
                        "http_or_transport_reads", "retry_needed")
              print("IDM_FINAL_HOME", name, json.dumps({k:row[k] for k in fields if k in row}))
              if (row.get("status") != status or row.get("displayed_unique", 0) < minimum
                  or (genres is not None and row.get("verified_landing_genres", 0) < genres)):
                  failures.append(name + ": incomplete or outside budget")
          if failures:
              raise SystemExit("; ".join(failures))
          PY
      - name: Preserve bounded final Home observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-final-home-80c18bf6
          path: idm-catalog-live-metrics/*.json
          if-no-files-found: warn
          retention-days: 7
