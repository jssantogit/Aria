name: AMS · style and real artwork live
on:
  push:
    branches: [audit/ams-native-visual-parity-20261126]
    paths:
      - '.github/workflows/ams-style-artwork-live.yml'
      - 'app/src/test/java/com/music/bitchord/AmsStyleArtworkLiveTest.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ams-style-artwork-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AMS_STYLE_ART_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check changed style and actual CDN contracts
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AmsStyleArtworkLiveTest'
      - name: Report observations
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('app/build/test-results/testDevDebugUnitTest').glob('*AmsStyleArtworkLiveTest.xml'))
          assert len(files)==1
          root=ET.parse(files[0]).getroot()
          for node in root.iter('system-out'):
              for line in (node.text or '').splitlines():
                  if line.startswith('AMS_STYLE_ART|'): print(line)
          assert int(root.attrib['tests'])==2 and int(root.attrib['skipped'])==0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-style-artwork-live-${{ github.sha }}
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
