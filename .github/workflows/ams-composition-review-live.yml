name: AMS · integrated subgenre composition review
on:
  push:
    branches: [audit/ams-composition-review-20261127, audit/ams-exact-release-motion-20261127, audit/ams-style-editorial-evidence-20261127, audit/ams-style-localization-20261127]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ams-composition-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  styles:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      AMS_STYLE_ART_LIVE: '1'
      AMS_STYLE_SHARD: '${{ matrix.shard }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify actual style page composition
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AmsStyleArtworkLiveTest.everyStylePageHasVerifiedContent'
      - name: Coverage report
        if: always()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('app/build/test-results/testDevDebugUnitTest').glob('*AmsStyleArtworkLiveTest.xml'))
          assert len(files)==1
          root=ET.parse(files[0]).getroot()
          assert int(root.attrib['tests'])==1 and int(root.attrib['skipped'])==0
          for node in root.iter('system-out'):
              for line in (node.text or '').splitlines():
                  if line.startswith('AMS_STYLE_ART|'): print(line)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-composition-${{ matrix.shard }}-${{ github.sha }}
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
