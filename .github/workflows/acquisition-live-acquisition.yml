name: Acquisition — Soulseek live acquisition
# Only explicitly trusted internal branch pushes or manual dispatch; never fork PRs.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acquisition-soulseek-ci-account
  cancel-in-progress: false
jobs:
  acquisition:
    if: github.repository == 'jssantogit/Aria'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build focused devDebug APKs without account secrets
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDevDebug :app:assembleDevDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Full live acquisition of authorized fixtures
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          SLSK_FIXTURES: ${{ vars.SOULSEEK_LIVE_FIXTURES }}
          SLSK_USER: ${{ secrets.SOULSEEK_CI_USERNAME || secrets.SOULSEEK_USERNAME || secrets.SOULSEEK_USER }}
          SLSK_PASS: ${{ secrets.SOULSEEK_CI_PASSWORD || secrets.SOULSEEK_PASSWORD || secrets.SOULSEEK_PASS }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/acquisition_live_acquisition.sh
      - name: Upload aggregate-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acquisition-live-acquisition-${{ github.run_id }}
          path: acquisition-live-acquisition.tsv
          if-no-files-found: ignore
          retention-days: 3
