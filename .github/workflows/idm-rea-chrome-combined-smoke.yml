# Temporary isolated smoke artifact for PR #224. Do not merge this workflow.
# Only the workflow file may differ from the combined code source.
name: IDM + REA — Combined Chrome Acceptance APK

on:
  push:
    branches:
      - smoke/idm-rea-chrome-combined-20261121
    paths:
      - .github/workflows/idm-rea-chrome-combined-smoke.yml

permissions:
  contents: read

concurrency:
  group: idm-rea-chrome-combined-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-apk:
    name: IDM and REA · combined top chrome APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact smoke candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact combined code source and isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          approved="eea62075d428d0f8cba21c399e09a180208ae73a"
          trigger=".github/workflows/idm-rea-chrome-combined-smoke.yml"
          git merge-base --is-ancestor "$approved" HEAD
          changed="$(git diff --name-only "$approved" HEAD)"
          if [[ "$changed" != "$trigger" ]]; then
            echo "::error::Smoke branch must differ from combined code source only by this workflow"
            printf 'Unexpected files:\n%s\n' "$changed"
            exit 1
          fi
          echo "Combined code source: $approved"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local debug build without service credentials
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew

      - name: Test combined IDM and REA presentation contracts
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests "com.music.bitchord.NativeTopBarPlacementPolicyTest" --tests "com.music.bitchord.ProviderSettingsReorderTest"
      - name: Test shared genre clearance regression
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :sharedUi:jvmTest --tests "com.music.bitchord.ui.screens.HomeGenreFloatingBackClearanceTest"

      - name: Build installable Android dev debug APK
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug

      - name: Verify APK and record immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          printf 'prs=224,225\ncombined_code_source=eea62075d428d0f8cba21c399e09a180208ae73a\nsmoke_commit=%s\ncredentials_embedded=no\n' "$(git rev-parse HEAD)" > idm-224-apk-manifest.txt
          find app/build/outputs/apk/dev/debug -name '*.apk' -type f -print -exec sha256sum '{}' \; >> idm-224-apk-manifest.txt
          grep -q '\.apk' idm-224-apk-manifest.txt

      - name: Publish isolated IDM smoke APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bit-chord-idm-rea-chrome-${{ github.sha }}
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            idm-224-apk-manifest.txt
          if-no-files-found: error
          retention-days: 14
