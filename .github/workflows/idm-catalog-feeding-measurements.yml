# CI-only measurement of catalogue processing; not an APK or physical smoke.
# Deterministic transports drive the real source adapters and Home/genre
# projection. Artifacts contain aggregate counts only, never source payloads.
# Live Discogs requests read DISCOGS_TOKEN from GitHub Actions Secrets only.
# Refreshing this workflow on the PR branch reruns both isolated and collective
# observations without changing production catalog sources or merging main.
name: 'IDM #224 · Catalogue feeding measurements'

on:
  push:
    branches:
      - integration/idm-providers-main-20261121
    paths:
      - .github/workflows/idm-catalog-feeding-measurements.yml
      - app/src/test/java/com/music/bitchord/IdmCatalogFeedingMeasurementTest.kt
      - app/src/test/java/com/music/bitchord/IdmCatalogCapacityCurveTest.kt
      - app/src/test/java/com/music/bitchord/CanonicalHomeGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/AppleHomeVerifiedPoolCapacityTest.kt
      - app/src/test/java/com/music/bitchord/AppleNativeHomeDiscoveryTest.kt
      - app/src/test/java/com/music/bitchord/AppleExploreGenreEditorialTest.kt
      - app/src/test/java/com/music/bitchord/CanonicalGenreTaxonomyTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsHomeGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsGenreGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsGranularEditorialCursorTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsClientContractTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsNativeArtistCatalogTest.kt
      - app/src/test/java/com/music/bitchord/NativeArtistTrackOriginTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsEvidenceContractTest.kt
      - app/src/test/java/com/music/bitchord/NativeMetadataAlbumPresentationTest.kt
      - app/src/test/java/com/music/bitchord/AppleEditorialNativeSearchBridgeTest.kt
      - app/src/test/java/com/music/bitchord/AppleSharedDetailAdapterTest.kt
      - app/src/test/java/com/music/bitchord/IdmCatalogLiveObservationTest.kt
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/**
      - app/src/main/java/com/music/bitchord/ui/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/idm-catalog-feeding-measurements.yml
      - app/src/test/java/com/music/bitchord/IdmCatalogFeedingMeasurementTest.kt
      - app/src/test/java/com/music/bitchord/IdmCatalogCapacityCurveTest.kt
      - app/src/test/java/com/music/bitchord/CanonicalHomeGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/AppleHomeVerifiedPoolCapacityTest.kt
      - app/src/test/java/com/music/bitchord/AppleNativeHomeDiscoveryTest.kt
      - app/src/test/java/com/music/bitchord/AppleExploreGenreEditorialTest.kt
      - app/src/test/java/com/music/bitchord/CanonicalGenreTaxonomyTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsHomeGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsGenreGranularPagingTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsGranularEditorialCursorTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsClientContractTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsNativeArtistCatalogTest.kt
      - app/src/test/java/com/music/bitchord/NativeArtistTrackOriginTest.kt
      - app/src/test/java/com/music/bitchord/DiscogsEvidenceContractTest.kt
      - app/src/test/java/com/music/bitchord/NativeMetadataAlbumPresentationTest.kt
      - app/src/test/java/com/music/bitchord/AppleEditorialNativeSearchBridgeTest.kt
      - app/src/test/java/com/music/bitchord/AppleSharedDetailAdapterTest.kt
      - app/src/test/java/com/music/bitchord/IdmCatalogLiveObservationTest.kt
      - app/src/main/java/com/music/bitchord/data/catalog/metadata/**
      - app/src/main/java/com/music/bitchord/ui/**
  workflow_dispatch:
    inputs:
      discogs_capacity_target:
        description: 'Cumulative verified Discogs Home capacity target (same Android gestures)'
        required: true
        default: '100'
        type: choice
        options:
          - '100'
          - '300'

permissions:
  contents: read

jobs:
  canonical-feeding:
    name: Real adapters · deterministic MB/Apple/Discogs and collective
    concurrency:
      group: idm-catalog-controlled-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IDM_CATALOG_METRICS_DIR: ${{ github.workspace }}/idm-catalog-metrics

    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested checkout is the actual PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Exact tested source: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare secretless Android unit-test environment
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          mkdir -p "$IDM_CATALOG_METRICS_DIR"

      - name: Exercise app catalog adapters and canonical Home/genre feeds
        run: |
          ./gradlew --no-daemon --build-cache -Pbitchord.bundleWear=false \
            :app:testDevDebugUnitTest \
            --tests 'com.music.bitchord.IdmCatalogFeedingMeasurementTest' \
            --tests 'com.music.bitchord.IdmCatalogCapacityCurveTest' \
            --tests 'com.music.bitchord.CanonicalHomeGranularPagingTest' \
            --tests 'com.music.bitchord.AppleHomeVerifiedPoolCapacityTest' \
            --tests 'com.music.bitchord.AppleNativeHomeDiscoveryTest' \
            --tests 'com.music.bitchord.AppleExploreGenreEditorialTest' \
            --tests 'com.music.bitchord.ui.CanonicalGenreTaxonomyTest' \
            --tests 'com.music.bitchord.DiscogsHomeGranularPagingTest' \
            --tests 'com.music.bitchord.DiscogsGenreGranularPagingTest' \
            --tests 'com.music.bitchord.DiscogsGranularEditorialCursorTest' \
            --tests 'com.music.bitchord.DiscogsClientContractTest' \
            --tests 'com.music.bitchord.DiscogsNativeArtistCatalogTest' \
            --tests 'com.music.bitchord.NativeArtistTrackOriginTest' \
            --tests 'com.music.bitchord.DiscogsEvidenceContractTest' \
            --tests 'com.music.bitchord.NativeMetadataAlbumPresentationTest' \
            --tests 'com.music.bitchord.AppleEditorialNativeSearchBridgeTest' \
            --tests 'com.music.bitchord.AppleSharedDetailAdapterTest'

      - name: Check completeness and write aggregate comparison
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          required = {
              "musicbrainz_isolated",
              "itunes_isolated",
              "discogs_isolated",
              "collective_all_priorities",
          }
          found = {path.stem: json.loads(path.read_text()) for path in folder.glob("*.json")}
          missing = required - found.keys()
          if missing:
              raise SystemExit(f"Missing required measurements: {sorted(missing)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### IDM #224: measured catalogue feeding (controlled fixture)\n\n")
              out.write("Uses production source parsers, editorial projections and dispatch; ")
              out.write("fixture transport is **not** evidence of live availability or popularity.\n\n")
              out.write("| Scenario | Raw candidates | Parsed/distinct | Editorial eligible | Visible IDs | Reads | Artwork | Cursor may remain |\n")
              out.write("|---|---:|---:|---:|---:|---:|---:|---|\n")
              for key in sorted(required):
                  row = found[key]
                  if row.get("mode") != "fixture-production-pipeline" or row.get("schema") != 1:
                      raise SystemExit(f"Invalid measurement schema: {key}")
                  cols = [key, row["raw_candidates"], row["parsed_distinct"],
                          row["editorial_eligible"], row["displayed_unique"],
                          row["http_or_transport_reads"], row["displayed_with_artwork"],
                          row["cursor_remaining"]]
                  out.write("| " + " | ".join(map(str, cols)) + " |\n")
              out.write("\nAll source identities remain provider-native. ")
              out.write("Aggregates are fixture counts; do not interpret as live coverage.\n")
          capacity = {f.stem.removeprefix("capacity_"): json.loads(f.read_text())
                      for f in folder.glob("capacity_*.json")}
          expected = {p + "_" + str(n).zfill(3)
                      for p in ("musicbrainz", "itunes", "discogs")
                      for n in (30, 100, 300)}
          if capacity.keys() != expected:
              raise SystemExit(f"Missing capacity curves: {sorted(expected - capacity.keys())}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n### Cursor capacity curves (controlled fixtures)\n\n")
              out.write("| Provider | Candidate target | Discovered | Verified unique | Reads | Coverage uncertain |\n")
              out.write("|---|---:|---:|---:|---:|---|\n")
              for key in sorted(expected):
                  item = capacity[key]
                  if item.get("mode") != "capacity-fixture":
                      raise SystemExit(f"Invalid capacity measurement: {key}")
                  cols = [item["provider"], item["target"],
                          item["source_candidates"], item["verified_unique"],
                          item["transport_reads"], item["coverage_uncertain"]]
                  out.write("| " + " | ".join(map(str, cols)) + " |\n")
              out.write("\nA fixture proving 300 local rows is not evidence of ")
              out.write("300 relevant real-world releases.\n")
          import xml.etree.ElementTree as ET
          # Source-curves and the ACTUAL Home handoff must both be exercised.
          # Counts here are passing fixture regressions, not remote API yield.
          suites = [
              "CanonicalHomeGranularPagingTest",
              "AppleHomeVerifiedPoolCapacityTest",
              "AppleNativeHomeDiscoveryTest",
              "AppleExploreGenreEditorialTest",
              "CanonicalGenreTaxonomyTest",
              "DiscogsHomeGranularPagingTest",
              "DiscogsGenreGranularPagingTest",
              "DiscogsGranularEditorialCursorTest",
              "DiscogsClientContractTest",
              "DiscogsNativeArtistCatalogTest",
              "NativeArtistTrackOriginTest",
              "DiscogsEvidenceContractTest",
              "NativeMetadataAlbumPresentationTest",
              "AppleEditorialNativeSearchBridgeTest",
              "AppleSharedDetailAdapterTest",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n### Home granular flows (controlled full-adapter regressions)\n\n")
              out.write("| Suite | Tests | Failures | Errors | Skipped |\n")
              out.write("|---|---:|---:|---:|---:|\n")
              for suite in suites:
                  path = Path("app/build/test-results/testDevDebugUnitTest") / (
                      ("TEST-com.music.bitchord.ui." if suite == "CanonicalGenreTaxonomyTest"
                       else "TEST-com.music.bitchord.") + suite + ".xml"
                  )
                  if not path.is_file():
                      raise SystemExit("Missing Home granular regression suite: " + suite)
                  node = ET.parse(path).getroot()
                  data = [int(node.get(key, "0"))
                          for key in ("tests", "failures", "errors", "skipped")]
                  if data[0] < 1 or data[1] or data[2]:
                      raise SystemExit("Home granular regression failed: " + suite)
                  out.write("| " + suite + " | " +
                            " | ".join(map(str, data)) + " |\n")
              out.write("\nThis validates code paths with fixture transports; ")
              out.write("it does not establish remote pagination completeness.\n")
          print("IDM_CATALOG_MEASUREMENTS_COMPLETE", sorted(found))
          PY

      - name: Preserve exact HEAD and aggregate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-catalog-measurements-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            idm-catalog-metrics/*.json
            app/build/test-results/testDevDebugUnitTest/
            app/build/reports/tests/testDevDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  live-observation:
    name: Live API observations · MB/Apple/Discogs and priority fallback
    # Non-gating remote availability is reported as a status, never silently
    # replaced by a fixture. A missing Discogs secret is explicitly blocked.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: canonical-feeding
    # Let active source observations finish even when a new HEAD is pushed.
    # All live jobs in this repository share the same Discogs credential budget.
    concurrency:
      group: idm-catalog-live-discogs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IDM_CATALOG_LIVE: '1'
      IDM_CATALOG_DISCOGS_CAPACITY_TARGET: ${{ inputs.discogs_capacity_target || '100' }}
      IDM_CATALOG_METRICS_DIR: ${{ github.workspace }}/idm-catalog-live-metrics
      IDM_CATALOG_DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}

    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify tested checkout is the actual PR head
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Exact tested source: \`$actual\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare secretless base properties and isolated reports
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          mkdir -p "$IDM_CATALOG_METRICS_DIR"

      - name: Observe live provider responses through production catalogue adapters
        run: |
          ./gradlew --no-daemon --build-cache -Pbitchord.bundleWear=false \
            :app:testDevDebugUnitTest \
            --tests 'com.music.bitchord.IdmCatalogLiveObservationTest.live_sources_and_collective_fallback_use_canonical_pipeline'

      - name: Summarize exact live results and capability blocks
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          required = {"musicbrainz", "musicbrainz_app_flow",
                      "musicbrainz_home_granular", "itunes", "itunes_home_granular",
                      "discogs", "discogs_granular", "discogs_home_granular",
                      "discogs_genre_12_positions", "discogs_overlapping_landing",
                      "discogs_home_landing", "discogs_artist_30_target",
                      "musicbrainz_home_capacity_30", "itunes_home_capacity_30",
                      "collective"}
          capacity_target = int(os.environ.get("IDM_CATALOG_DISCOGS_CAPACITY_TARGET", "100"))
          capacity_scenarios = [f"discogs_home_capacity_{n}" for n in (30, 100, 300)
                                if n <= capacity_target]
          required.update(capacity_scenarios)
          data = {
              f.stem.removeprefix("live_"): json.loads(f.read_text())
              for f in path.glob("live_*.json")
          }
          if required - data.keys():
              raise SystemExit("Live observation report missing required source states")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Live API observation (not a fixture and not a popularity score)\n\n")
              out.write("| Source | Status | Raw page rows | Parsed | Eligible | Visible | Artwork | Reads |\n")
              out.write("|---|---|---:|---:|---:|---:|---:|---:|\n")
              for name in ("musicbrainz", "musicbrainz_app_flow",
                           "musicbrainz_home_granular", "itunes", "itunes_home_granular",
                           "discogs", "discogs_granular", "discogs_home_granular",
                           "discogs_genre_12_positions", "discogs_overlapping_landing",
                           "discogs_home_landing", "discogs_artist_30_target",
                           "musicbrainz_home_capacity_30", "itunes_home_capacity_30",
                           *capacity_scenarios, "collective"):
                  row = data[name]
                  if row.get("mode") != "live-network-observation":
                      raise SystemExit("Incorrect live report type")
                  fields = [name, row["status"], row["raw_candidates"],
                      row["parsed_distinct"], row["editorial_eligible"],
                      row["displayed_unique"], row["displayed_with_artwork"],
                      row["http_or_transport_reads"]]
                  out.write("| " + " | ".join(map(str, fields)) + " |\n")
                  # Emit only allowlisted aggregate telemetry, never source payloads.
                  keys = ("status", "editorial_eligible", "displayed_unique",
                          "http_or_transport_reads", "source_candidates_consumed",
                          "source_candidate_budget", "verified_target",
                          "source_index_reads", "source_master_reads",
                          "source_release_reads", "elapsed_ms", "first_verified_ms",
                          "landing_checkpoint_used", "start_page", "start_position",
                          "initial_elapsed_ms", "initial_first_verified_ms",
                          "known_verified_masters", "new_verified_emitted",
                          "source_queries_attempted", "landing_checkpoints",
                          "source_pages_completed", "incomplete_coverage",
                          "source_gestures", "source_chunks_attempted",
                          "continuation_elapsed_ms", "verified_landing_genres",
                          "next_window_has_more")
                  aggregate = {key: row[key] for key in keys if key in row}
                  print("IDM_LIVE_AGGREGATE", name, json.dumps(aggregate, sort_keys=True))
              out.write("\nA null count means unavailable telemetry, not zero. ")
              out.write("Discogs without a CI token is **not measured**. ")
              out.write("This is one sampled observation, not exhaustive source coverage.\n")
          PY

      - name: Observe fixed live genre matrix (#227)
        run: |
          ./gradlew --no-daemon --build-cache -Pbitchord.bundleWear=false \
            :app:testDevDebugUnitTest \
            --tests 'com.music.bitchord.IdmCatalogLiveObservationTest.live_genre_parity_matrix'

      - name: Summarize all 45 genre matrix cells
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          tags = ("pop", "rock", "hip_hop", "electronic", "jazz", "k_pop",
                  "metal", "rnb", "folk", "hard_rock", "house", "techno", "trance",
                  "smooth_jazz", "bluegrass")
          capacity = {"rock", "electronic", "jazz"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n### #227 fixed genre matrix (live observations)\n\n")
              out.write("| Provider | Tag | Landing | Cumulative | Gestures | Status |\n")
              out.write("|---|---|---:|---:|---:|---|\n")
              for provider in ("musicbrainz", "itunes", "discogs"):
                  for tag in tags:
                      name = f"genre_matrix_{provider}_{tag}"
                      row = json.loads((path / f"live_{name}.json").read_text())
                      if row.get("mode") != "live-network-observation":
                          raise SystemExit("Wrong report mode")
                      expected_landing = 6 if tag in tags[:9] else 4
                      expected_target = 30 if tag in capacity else expected_landing
                      if row["landing_target"] != expected_landing or row["verified_target"] != expected_target:
                          raise SystemExit("Frozen parity target mismatch")
                      keys = ("status", "landing_visible_releases", "landing_target",
                              "displayed_unique", "verified_target", "source_gestures",
                              "first_scroll_new_releases", "source_queries_attempted", "elapsed_ms")
                      aggregate = {key: row[key] for key in keys}
                      print("IDM_GENRE_MATRIX", name, json.dumps(aggregate, sort_keys=True))
                      out.write(f"| {provider} | {tag} | {row['landing_visible_releases']} | "
                                f"{row['displayed_unique']} | {row['source_gestures']} | {row['status']} |\n")
          PY

      - name: Observe fixed live artist matrix (#228)
        run: |
          ./gradlew --no-daemon --build-cache -Pbitchord.bundleWear=false \
            :app:testDevDebugUnitTest \
            --tests 'com.music.bitchord.IdmCatalogLiveObservationTest.live_artist_parity_matrix'

      - name: Summarize all 30 artist matrix cells
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n### #228 artist identity and discography projection (not Activity navigation)\n\n")
              out.write("| Provider | Case | Anchor | Visible | Gestures | Status |\n")
              out.write("|---|---|---:|---:|---:|---|\n")
              for provider in ("musicbrainz", "itunes", "discogs"):
                  for i in range(1, 11):
                      name = f"artist_matrix_{provider}_{i:02d}"
                      row = json.loads((path / f"live_{name}.json").read_text())
                      if row.get("mode") != "live-network-observation" or row["verified_target"] != (30 if i <= 5 else 1):
                          raise SystemExit("Frozen artist matrix mismatch")
                      keys = ("status", "anchor_verified", "profile_projection_verified",
                              "displayed_unique", "verified_target", "source_gestures",
                              "landing_visible_releases", "automatic_pages", "release_sections",
                              "verified_track_rows", "first_profile_ms", "incomplete_coverage", "elapsed_ms")
                      print("IDM_ARTIST_MATRIX", name, json.dumps({k: row[k] for k in keys}, sort_keys=True))
                      out.write(f"| {provider} | {i:02d} | {row['anchor_verified']} | "
                                f"{row['displayed_unique']} | {row['source_gestures']} | {row['status']} |\n")
          PY

      - name: Archive aggregate live observations and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-catalog-live-observation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            idm-catalog-live-metrics/*.json
            app/build/test-results/testDevDebugUnitTest/
            app/build/reports/tests/testDevDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
