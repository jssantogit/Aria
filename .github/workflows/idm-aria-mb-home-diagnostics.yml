name: IDM · isolated MusicBrainz Home diagnostic
on:
  push:
    branches: [audit/idm-aria-namespace-integration-20261126]
    paths: [.github/workflows/idm-aria-mb-home-diagnostics.yml]
permissions:
  contents: read
  actions: read
jobs:
  live-observation:
    name: MusicBrainz-only Home observations
    concurrency:
      group: idm-catalog-live-musicbrainz-home
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDM_CATALOG_LIVE: '1'
      IDM_CATALOG_LIVE_SCOPE: 'full'
      IDM_CATALOG_DISCOGS_CAPACITY_TARGET: '100'
      IDM_CATALOG_METRICS_DIR: ${{ github.workspace }}/idm-catalog-live-metrics
      IDM_SEARCH_TOP10_REVIEW: '0'
    steps:
      - name: Checkout audit source with complete parent history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve the already validated candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: sealed-idm-aria-candidate
          run-id: 45844770994
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/sealed-idm
      - name: Verify exact candidate object and checked out tree
        shell: bash
        run: |
          set -euo pipefail
          expected=e16bf6764d97fdb5c1dcafa44235a6dd156f102c
          tree=1954dec45b353e7769ab0acf8d1fae6017fe610f
          main=58d8d9143fa04302cb3356df510e77c76a2eae57
          idm=cc23ae77949260fb3ce51a9f6a45d93481c3ed84
          sealed="$RUNNER_TEMP/sealed-idm"
          test "$(cat "$sealed/sealed-commit.txt")" = "$expected"
          test "$(cat "$sealed/resolved-tree.txt")" = "$tree"
          git bundle verify "$sealed/sealed-candidate.bundle"
          git fetch "$sealed/sealed-candidate.bundle" refs/heads/sealed-idm-aria-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git show -s --format=%P "$expected")" = "$main $idm"
          test "$(git rev-parse "$expected^{tree}")" = "$tree"
          git checkout --detach "$expected"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain)"
          echo "Exact sealed source: $expected (tree $tree)" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare secretless base properties and isolated reports
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew
          mkdir -p "$IDM_CATALOG_METRICS_DIR"
          case "$IDM_CATALOG_LIVE_SCOPE" in full|itunes-albums|itunes-musicbrainz-search) ;; *) exit 1 ;; esac
          echo "Live scope: $IDM_CATALOG_LIVE_SCOPE (focused results are not full parity)" >> "$GITHUB_STEP_SUMMARY"

      - name: Add aggregate-only diagnostics in disposable checkout and isolate MusicBrainz
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          patches = json.loads("[[\"app/src/main/java/com/music/aria/data/catalog/metadata/MusicBrainzCatalogSearch.kt\",[[\"        } catch (_: Exception) {\\n            return MusicBrainzCatalogSearchResult.Failure(MusicBrainzCatalogSearchFailure.UNAVAILABLE)\\n        }\\n        val parsed = try {\",\"        } catch (failure: Exception) {\\n            val kind = when {\\n                query.startsWith(\\\"firstreleasedate:\\\") -> \\\"date\\\"\\n                query.startsWith(\\\"tag:\\\") -> \\\"tag\\\"\\n                else -> \\\"other\\\"\\n            }\\n            println(\\\"IDM_MB_HOME_DIAG kind=$kind offset=$offset limit=$limit failure=\\\" +\\n                failure.javaClass.simpleName)\\n            return MusicBrainzCatalogSearchResult.Failure(MusicBrainzCatalogSearchFailure.UNAVAILABLE)\\n        }\\n        val parsed = try {\"],[\"        return if (parsed == null || parsed.offset != offset || parsed.consumedCount > limit) {\",\"        val kind = when {\\n            query.startsWith(\\\"firstreleasedate:\\\") -> \\\"date\\\"\\n            query.startsWith(\\\"tag:\\\") -> \\\"tag\\\"\\n            else -> \\\"other\\\"\\n        }\\n        println(\\\"IDM_MB_HOME_DIAG kind=$kind offset=$offset limit=$limit decoded=\\\" +\\n            (parsed != null) + \\\" returnedOffset=\\\" + parsed?.offset +\\n            \\\" consumed=\\\" + parsed?.consumedCount + \\\" total=\\\" + parsed?.total)\\n        return if (parsed == null || parsed.offset != offset || parsed.consumedCount > limit) {\"]]]]")
          for path, replacements in patches:
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  assert s.count(old) == 1
                  s = s.replace(old, new)
              p.write_text(s)
          p = Path("app/src/test/java/com/music/aria/IdmCatalogLiveObservationTest.kt")
          s = p.read_text()
          start = s.index("    @Test fun live_sources_and_collective_fallback_use_canonical_pipeline()")
          cut = s.index("        val appleCaps = setOf(ProviderCapability.CATALOG_SEARCH,", start)
          end = s.index("        assertEquals(6, orders.size)", cut)
          end = s.index("\n    }", end)
          # Preserve all MB queries, production scanner and projection; omit
          # the remaining providers and collective only in the disposable test.
          p.write_text(s[:cut] + s[end:])
          PY
          test "$(git diff --name-only | wc -l)" -eq 2
          git diff --check
      - name: Observe only the existing MusicBrainz Home flow
        run: |
          ./gradlew --no-daemon --build-cache :app:testDevDebugUnitTest \
            --tests 'com.music.aria.IdmCatalogLiveObservationTest.live_sources_and_collective_fallback_use_canonical_pipeline'
      - name: Recover bounded outcome diagnostics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import json, os
          root = Path("app/build/test-results/testDevDebugUnitTest")
          reports = list(root.glob("TEST-*IdmCatalogLiveObservationTest.xml"))
          assert len(reports) == 1
          found = []
          for output in ET.parse(reports[0]).getroot().iter("system-out"):
              for line in (output.text or "").splitlines():
                  if line.startswith("IDM_MB_HOME_DIAG "):
                      found.append(line)
                      print(line)
          assert found
          folder = Path(os.environ["IDM_CATALOG_METRICS_DIR"])
          for name in ("musicbrainz", "musicbrainz_app_flow", "musicbrainz_home_granular", "musicbrainz_home_capacity_30"):
              row = json.loads((folder / f"live_{name}.json").read_text())
              fields = ("status", "displayed_unique", "editorial_eligible", "verified_landing_genres",
                        "http_or_transport_reads", "narrow_window_reads", "wide_window_reads",
                        "historical_window_reads", "genre_supplement_reads", "retry_needed")
              print("IDM_MB_HOME_RESULT", name, json.dumps({k:row[k] for k in fields if k in row}))
          PY
      - name: Preserve aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idm-musicbrainz-home-diagnostic
          path: idm-catalog-live-metrics/*.json
          if-no-files-found: warn
          retention-days: 7
