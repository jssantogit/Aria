name: AMS · canonical live integration
on:
  push:
    branches: [audit/ams-native-visual-parity-20261126]
    paths:
      - '.github/workflows/ams-canonical-live.yml'
      - 'app/src/test/java/com/music/bitchord/AppleMusicWebCanonicalLiveTest.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ams-canonical-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AMS_CANONICAL_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Exercise native consumer and provider boundaries
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AppleMusicWebCanonicalLiveTest'
      - name: Emit bounded canonical evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = list(Path('app/build/test-results/testDevDebugUnitTest').glob('*AppleMusicWebCanonicalLiveTest.xml'))
          assert files, 'Missing canonical live test report'
          observations = []
          for file in files:
              root = ET.parse(file).getroot()
              assert int(root.attrib.get('tests','0')) == 4, 'Incomplete live scope'
              assert int(root.attrib.get('skipped','0')) == 0, 'Live scopes skipped'
              for node in root.iter('system-out'):
                  for line in (node.text or '').splitlines():
                      if line.startswith('AMS_UI_LIVE|'):
                          print(line)
                          observations.append(line)
          assert observations, 'No live observations'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## AMS native live evidence\n\n')
              f.write('\n'.join('- '+line for line in observations)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-canonical-live-${{ github.sha }}
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
