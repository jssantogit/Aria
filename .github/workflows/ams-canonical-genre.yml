name: AMS · canonical genre and detail integration contracts
on:
  push:
    branches:
      - integration/ams-canonical-genre-20261126
      - audit/ams-native-visual-parity-20261126
      - audit/ams-composition-review-20261127
      - audit/ams-exact-release-motion-20261127
      - audit/ams-release-media-review-20261127
      - audit/ams-style-editorial-evidence-20261127
      - audit/ams-style-localization-20261127
      - audit/ams-media-lifecycle-20261127
      - audit/ams-final-style-evidence-20261127
      - audit/ams-style-candidate-admission-20261127
      - audit/ams-genre-relationships-20261127
      - audit/ams-curator-detail-evidence-20261127
      - audit/ams-track-discovery-budget-20261127
      - audit/ams-style-provenance-20261127
      - audit/ams-style-conflict-quarantine-20261127
      - audit/ams-style-refresh-quarantine-20261127
      - audit/ams-detail-permission-reactivity-20261127
      - audit/ams-native-rating-reconciliation-20261127
      - audit/ams-detail-host-reconciliation-20261127
      - audit/ams-provider-overflow-reconciliation-20261127
      - audit/ams-held-menu-lifecycle-20261127
      - audit/ams-provider-lifted-menu-20261127
      - audit/ams-provider-lifted-admission-20261127
      - audit/ams-held-action-admission-20261127
permissions:
  contents: read
concurrency:
  group: ams-canonical-genre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native session and canonical projection
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AppleMusicWebNativeCatalogSessionTest' --tests 'com.music.bitchord.AmsTrackStyleProjectionTest' --tests 'com.music.bitchord.AppleArtistArtCapabilityTest' --tests 'com.music.bitchord.AppleMusicWebEditorialUiSessionTest' --tests 'com.music.bitchord.CanonicalHomeEditorialDispatchTest' --tests 'com.music.bitchord.AppleMusicWebDetailNavigationTest' --tests 'com.music.bitchord.AppleNativeDetailNavigationTest' --tests 'com.music.bitchord.ProviderReadLeaseTest' --tests 'com.music.bitchord.AppleMusicWebSharedDetailAdapterTest' --tests 'com.music.bitchord.AppleMusicWebSupplementalDetailTest' --tests 'com.music.bitchord.AppleMusicWebSearchUiSessionTest' --tests 'com.music.bitchord.ui.screens.AmsVisualParityPolicyTest' --tests 'com.music.bitchord.ui.screens.NativeArtistSimilarArtworkTest' --tests 'com.music.bitchord.ui.screens.CanonicalAlbumDetailParityTest' --tests 'com.music.bitchord.ui.screens.CanonicalArtistReleaseSubtitleTest' --tests 'com.music.bitchord.NativeTopBarRouteOwnerTest' --tests 'com.music.bitchord.ui.screens.NativeSearchSecondaryActionTest' --tests 'com.music.bitchord.ui.components.GlobalAppleVisualTokensTest' --tests 'com.music.bitchord.AppleSharedDetailAdapterTest' --tests 'com.music.bitchord.CanonicalGenreEditorialDispatchTest' --tests 'com.music.bitchord.CanonicalEditorialFeedProjectionTest' --tests 'com.music.bitchord.AppleMusicWebLandingPersistenceTest' --tests 'com.music.bitchord.AppleMusicWebCuratorLandingTest' --tests 'com.music.bitchord.AppleMusicWebCuratorsTest' --tests 'com.music.bitchord.ui.screens.NativePlaylistHeroActionsTest' --tests 'com.music.bitchord.ui.screens.NativeReleaseRatingLayoutTest' --tests 'com.music.bitchord.CanonicalGenreGranularPagingTest' --tests 'com.music.bitchord.CanonicalHomeGranularPagingTest' --tests 'com.music.bitchord.AppleMusicWebDiscographyPagingTest' --tests 'com.music.bitchord.AppleMusicWebPlaylistContractTest' --tests 'com.music.bitchord.ui.AmsCountryChartIntegrationTest' --tests 'com.music.bitchord.ui.CanonicalCountryChartPresentationTest' --tests 'com.music.bitchord.AppleMusicWebChartsTest' --tests 'com.music.bitchord.AppleMusicWebFoundationTest' --tests 'com.music.bitchord.AmsPhysicalSmokePolicyTest' --tests 'com.music.bitchord.AppleMusicWebNativeProviderTest' --tests 'com.music.bitchord.NativeMetadataAlbumPresentationTest' --tests 'com.music.bitchord.ui.screens.CanonicalCatalogEntityRatingsTest' --tests 'com.music.bitchord.ui.screens.CatalogMetadataPinsTest' --tests 'com.music.bitchord.ui.screens.CanonicalCatalogRatingMenuTest' --tests 'com.music.bitchord.ui.screens.CatalogMetadataActionPolicyTest' --tests 'com.music.bitchord.ui.screens.CatalogMetadataRecordingLabelTest' --tests 'com.music.bitchord.ui.screens.CanonicalMetadataPlaylistCreateTest'
      - name: Shared shelf artwork presentation guard
        run: ./gradlew -Pbitchord.bundleWear=false :sharedUi:jvmTest --tests 'com.music.bitchord.ui.screens.AppleProminentArtworkGuardTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-canonical-genre-results
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
