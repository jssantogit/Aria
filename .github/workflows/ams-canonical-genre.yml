name: AMS · canonical genre and detail integration contracts
on:
  push:
    branches:
      - integration/ams-canonical-genre-20261126
      - audit/ams-native-visual-parity-20261126
permissions:
  contents: read
concurrency:
  group: ams-canonical-genre-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Native session and canonical projection
        run: |
          chmod +x gradlew
          ./gradlew -Pbitchord.bundleWear=false :app:testDevDebugUnitTest --tests 'com.music.bitchord.AppleMusicWebNativeCatalogSessionTest' --tests 'com.music.bitchord.AppleMusicWebEditorialUiSessionTest' --tests 'com.music.bitchord.CanonicalHomeEditorialDispatchTest' --tests 'com.music.bitchord.AppleMusicWebDetailNavigationTest' --tests 'com.music.bitchord.AppleMusicWebSharedDetailAdapterTest' --tests 'com.music.bitchord.AppleMusicWebSupplementalDetailTest' --tests 'com.music.bitchord.AppleMusicWebSearchUiSessionTest' --tests 'com.music.bitchord.ui.screens.AmsVisualParityPolicyTest' --tests 'com.music.bitchord.ui.screens.NativeArtistSimilarArtworkTest' --tests 'com.music.bitchord.ui.screens.CanonicalAlbumDetailParityTest' --tests 'com.music.bitchord.ui.screens.CanonicalArtistReleaseSubtitleTest' --tests 'com.music.bitchord.NativeTopBarRouteOwnerTest' --tests 'com.music.bitchord.ui.screens.NativeSearchSecondaryActionTest' --tests 'com.music.bitchord.ui.components.GlobalAppleVisualTokensTest' --tests 'com.music.bitchord.AppleSharedDetailAdapterTest' --tests 'com.music.bitchord.CanonicalGenreEditorialDispatchTest' --tests 'com.music.bitchord.CanonicalEditorialFeedProjectionTest' --tests 'com.music.bitchord.AppleMusicWebLandingPersistenceTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ams-canonical-genre-results
          path: app/build/test-results/testDevDebugUnitTest/
          retention-days: 7
