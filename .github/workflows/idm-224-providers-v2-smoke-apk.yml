# Temporary isolated smoke artifact for PR #224. Do not merge this workflow.
# Only the workflow file may differ from the Android-CI-approved source.
name: IDM #224 — Providers UI v2 Smoke APK

on:
  push:
    branches:
      - smoke/idm-224-providers-ui-v2-20261121
    paths:
      - .github/workflows/idm-224-providers-v2-smoke-apk.yml

permissions:
  contents: read

concurrency:
  group: idm-224-providers-v2-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-ui-apk:
    name: IDM #224 · providers UI v2 dev debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact smoke candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact CI-approved sources and isolated trigger
        shell: bash
        run: |
          set -euo pipefail
          approved="df6fea96742ece2f63ed10350e5a53a7b2c9d540"
          trigger=".github/workflows/idm-224-providers-v2-smoke-apk.yml"
          git merge-base --is-ancestor "$approved" HEAD
          changed="$(git diff --name-only "$approved" HEAD)"
          if [[ "$changed" != "$trigger" ]]; then
            echo "::error::Smoke branch must differ from CI-approved source only by this workflow"
            printf 'Unexpected files:\n%s\n' "$changed"
            exit 1
          fi
          echo "Approved production and test source: $approved"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure local debug build without service credentials
        shell: bash
        run: |
          printf 'LASTFM_API_KEY=\nLASTFM_SECRET=\n' > local.properties
          chmod +x gradlew

      - name: Build installable Android dev debug APK
        run: ./gradlew --build-cache -Pbitchord.bundleWear=false :app:assembleDevDebug

      - name: Verify APK and record immutable provenance
        shell: bash
        run: |
          set -euo pipefail
          printf 'pr=224\nci_approved_source=df6fea96742ece2f63ed10350e5a53a7b2c9d540\nsmoke_commit=%s\ncredentials_embedded=no\n' "$(git rev-parse HEAD)" > idm-224-apk-manifest.txt
          find app/build/outputs/apk/dev/debug -name '*.apk' -type f -print -exec sha256sum '{}' \; >> idm-224-apk-manifest.txt
          grep -q '\.apk' idm-224-apk-manifest.txt

      - name: Publish isolated IDM smoke APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: bit-chord-idm-pr224-providers-v2-smoke-${{ github.sha }}
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            idm-224-apk-manifest.txt
          if-no-files-found: error
          retention-days: 14
